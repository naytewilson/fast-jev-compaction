name: Semantic Retention Lab CI

on:
  push:
    branches:
      - north/anvil-sieve-semantic-retention-v0
      - north/authority-preserving-semantic-fabric-v1
      - north/semantic-fabric-v1-integrated-hardened-calibration-20260918
      - north/jev-empirical-abi-v2-20260918
    paths:
      - "src/**"
      - "tests/**"
      - "tools/native/causal-stepper/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/lab-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/native/causal-stepper/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/lab-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build native causal stepper
        working-directory: tools/native/causal-stepper
        run: swift build -c release
      - name: Run native causal-stepper regressions
        working-directory: tools/native/causal-stepper
        run: swift run -c release CausalStepperTests
